spring:
  datasource:
    url: jdbc:h2:mem:hermes;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    # The migrations are Postgres-specific (jsonb, partial indexes). Unit tests run against
    # Hibernate's generated schema instead; the migrations are exercised in the cluster.
    enabled: false

hermes:
  shadow-mode: false
  # Fixed 32-byte test key; the cipher requires a real one and must not invent a random fallback.
  encryption-key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
  admin-token: ""
  gmail:
    refresh-token: ""
  sidecar:
    enabled: false
  alerts:
    webhook-secret: test-secret
