spring:
  application:
    name: hermes-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hermes}
    username: ${DATABASE_USER:hermes}
    password: ${DATABASE_PASSWORD:hermes}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Validate on boot so a missing migration fails the pod loudly
      # instead of surfacing as a runtime column-not-found on the first poll.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  task:
    scheduling:
      shutdown:
        # Let the running poll finish its current message and exit at the next boundary
        # (GmailSyncService checks a shutdown flag), but never hold termination open for long.
        await-termination: true
        await-termination-period: 20s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # Health (k8s probes) + the Prometheus scrape. Kept on the app port: Traefik routes only
        # /api, /v3/api-docs and two exact /api paths of this host to the backend (everything else
        # goes to the frontend), so /actuator is reachable from inside the cluster only.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  # Every label combination is one series, and the whole cluster shares Grafana Cloud's free tier
  # of 10,000. Hence the trims below.
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Client-side percentiles, NOT a bucket histogram: Alloy drops every `_bucket` series before
      # it leaves the cluster, so a histogram would cost the scrape and deliver nothing.
      #
      # The trade-off: these are computed inside this JVM, so they cannot be re-aggregated across
      # replicas and a quantile not listed here cannot be recovered afterwards. Fine, because this
      # service is a deliberate singleton (the poll loop would double-push with two replicas).
      #
      # No median: ~36 routes, and every route x status pair costs one series per quantile. The
      # mean (sum / count) is there for free if a "typical" number is ever wanted.
      percentiles-histogram:
        http.server.requests: false
      percentiles:
        http.server.requests: 0.95, 0.99
    # Meter families nobody reads. Kept: http.server.requests, jvm.memory, jvm.gc, jvm.threads,
    # process/system cpu, process.uptime, hikaricp, jdbc.connections, logback.events, disk.
    enable:
      spring.security: false
      spring.data.repository: false
      tomcat.sessions: false
      jvm.buffer: false
      jvm.classes: false
      jvm.compilation: false
      executor: false
      tasks.scheduled: false
      application.started.time: false
      application.ready.time: false
      http.server.requests.active: false
      process.files: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

hermes:
  timezone: ${HERMES_TIMEZONE:Europe/Berlin}
  # Base64 32 bytes — `openssl rand -base64 32`. Protects the stored Google refresh token.
  encryption-key: ${HERMES_ENCRYPTION_KEY:}
  # Machine access to /api, for callers with no Authentik session (scripts, the Janus widget).
  # Browsers are gated at the ingress by forward auth instead. Unset = open to anything that
  # reaches the pod, which is only acceptable locally.
  admin-token: ${HERMES_ADMIN_TOKEN:}
  # Phase 3 default. Everything is classified and stored; nothing pushes until this is flipped.
  shadow-mode: ${HERMES_SHADOW_MODE:true}
  gmail:
    client-id: ${GMAIL_CLIENT_ID:}
    client-secret: ${GMAIL_CLIENT_SECRET:}
    # Bootstrap escape hatch. The normal path is the in-app Sign in with Google flow, which
    # stores an encrypted token in Postgres and takes precedence over this.
    refresh-token: ${GMAIL_REFRESH_TOKEN:}
    user-id: me
    redirect-uri: ${GMAIL_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
    post-connect-redirect: ${GMAIL_POST_CONNECT_REDIRECT:/settings?connected=1}
    # history.list costs one cheap quota unit per tick and only the delta is fetched, so the floor
    # here is latency-to-notice, not API budget. Overridable so it can be tuned in the ConfigMap
    # without a rebuild.
    poll-interval: ${GMAIL_POLL_INTERVAL:30s}
    cold-start-max-messages: 100
    snippet-length: 500
  sidecar:
    # Pod-local only. The sidecar holds an account-level Claude credential.
    base-url: ${SIDECAR_URL:http://127.0.0.1:8081}
    # Measured, not guessed: a classification turn takes 13-18s in the cluster, because the Agent
    # SDK spawns a subprocess per query. The old 30s left barely one standard deviation of headroom,
    # so the slow tail timed out — and a timed-out read surfaces as an unreadable response rather
    # than a clean error, which is what kept killing the backfill after two messages.
    timeout: ${SIDECAR_TIMEOUT:90s}
    enabled: ${SIDECAR_ENABLED:true}
  ntfy:
    base-url: ${NTFY_URL:https://ntfy.jannekeipert.de}
    topic: ${NTFY_TOPIC:hermes-mail}
    token: ${NTFY_TOKEN:}
    timeout: 10s
  digest:
    send-time: ${DIGEST_SEND_TIME:18:00}
    include-noise: true
    skip-when-empty: false
    # One extra Haiku turn per day, at send time. Off falls back to the bare list.
    narrative: ${DIGEST_NARRATIVE:true}
  alerts:
    webhook-secret: ${ALERT_WEBHOOK_SECRET:}
    push-delay: 0s
  retention:
    message-days: ${RETENTION_DAYS:90}
  quiet-hours:
    enabled: ${QUIET_HOURS_ENABLED:false}
    start: "23:00"
    end: "07:30"
    allow-security-alerts: true

logging:
  level:
    com.janne6565.hermes: ${LOG_LEVEL:INFO}
